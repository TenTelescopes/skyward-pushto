<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Skyward">
  <title>Skyward Push-To</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="status">
    <button id="st-scope" class="stbtn" aria-label="Telescope settings"></button>
    <button id="st-pill" class="pill" aria-live="polite"></button>
    <button id="hb-day" class="hbtn shadebtn" aria-label="Day or night look"></button>
    <button id="hb-fs" class="hbtn" aria-label="Full screen"></button>
  </header>
  <div id="flowbar" class="hidden"></div>

  <main>
    <section id="tab-find" class="tab"></section>
    <section id="tab-plan" class="tab"></section>
    <section id="tab-push" class="tab"></section>
    <section id="tab-game" class="tab"></section>
    <section id="tab-more" class="tab"></section>
    <section id="tab-align" class="tab"></section>
    <section id="tab-log" class="tab"></section>
    <section id="tab-test" class="tab"></section>
    <section id="tab-setup" class="tab"></section>
  </main>

  <nav id="tabs">
    <button data-tab="find"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg><span>Find</span></button>
    <button data-tab="plan"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L6.8 5M3.5 12l1.2 1.2L6.8 11M3.5 18l1.2 1.2L6.8 17"/></svg><span>Plan</span></button>
    <button data-tab="push"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg><span>Push</span></button>
    <button data-tab="game"><svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="7"/><path d="M12 14v-4M10 3h4M12 3v4M18.5 7.5 20 6"/></svg><span>Game</span></button>
    <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg><span>More</span></button>
  </nav>

  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 200 150" class="spl-art">
      <g class="spl-stars" fill="#fff"><circle cx="24" cy="30" r="1.1"/><circle cx="58" cy="14" r=".8"/><circle cx="92" cy="26" r="1"/><circle cx="150" cy="18" r="1.3"/><circle cx="176" cy="54" r=".8"/><circle cx="34" cy="66" r=".7"/><circle cx="14" cy="100" r=".8"/><circle cx="186" cy="104" r=".9"/></g>
      <path class="spl-shoot" d="M60 16 L26 40" stroke="#ffe3a8" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M0 150 Q100 128 200 150Z" fill="#0a0e26"/>
      <g stroke="#2b44c9" stroke-width="5" stroke-linecap="round"><path d="M100 120 82 147M100 120v27M100 120l18 27"/></g>
      <g class="spl-tube">
        <rect x="50" y="72" width="104" height="24" rx="3" fill="#39406b" stroke="#6470ad" stroke-width="1.2"/>
        <rect x="48" y="69" width="10" height="30" rx="2" fill="#2f4bd8"/><rect x="146" y="69" width="10" height="30" rx="2" fill="#ff5fb0"/>
        <path d="M126 72v-8h16" fill="none" stroke="#6470ad" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      </g>
      <path d="M78 80h44l3 36H75z" fill="#2f4bd8"/>
      <g fill="#0f1640"><rect x="84" y="103" width="7" height="10" rx="3.5"/><rect x="96" y="106" width="8" height="7" rx="3.5"/><rect x="109" y="103" width="7" height="10" rx="3.5"/></g>
      <rect x="72" y="114" width="56" height="7" rx="2" fill="#ff5fb0"/>
      <g class="spl-tube">
        <circle cx="100" cy="84" r="17" fill="#0f1640" stroke="#2f4bd8" stroke-width="4"/>
        <polygon points="100.0,72.0 102.9,80.0 111.4,80.3 104.8,85.5 107.1,93.7 100.0,89.0 92.9,93.7 95.2,85.5 88.6,80.3 97.1,80.0" fill="#ff5fb0"/>
      </g>
    </svg>
    <div class="spl-name">Skyward <span>Push-To</span></div>
    <div class="spl-tag">Point. Push. Wow.</div>
  </div>
  <div id="gate" class="overlay">
    <div class="card">
      <div id="launch"><h1>Skyward Push-To</h1><p class="muted">Loading…</p></div>
      <p id="gate-msg" class="muted"></p>
      <button id="gate-skip" class="hidden" style="width:100%;margin-top:8px">Continue without sensors</button>
      <button id="gate-sim" class="hidden" style="width:100%;margin-top:8px">Simulate sensors (desktop testing)</button>
      <p class="muted small" style="text-align:center;margin:10px 0 0">Build 29 · Nov 16</p>
    </div>
  </div>
  <div id="skycheck" class="overlay hidden"><div class="card" id="skycheck-card"></div></div>
  <div id="sheet" class="overlay sheet hidden"><div class="card" id="sheet-card"></div></div>
  <div id="fs-help" class="overlay hidden"><div class="card">
    <h3 style="margin-top:0">Full screen</h3>
    <div class="fs-body"></div>
    <button id="fs-close" class="primary" style="width:100%">OK</button>
  </div></div>
  <div id="toast" class="hidden" role="status"></div>
  <div id="scanner" class="overlay hidden"><div class="card" style="text-align:center">
    <h3 style="margin-top:0">Scan a Skyward code</h3>
    <video id="scan-video" playsinline muted style="width:100%;border-radius:10px;background:#000"></video>
    <p id="scan-msg" class="muted small">Point the camera at the other phone's code.</p>
    <div class="btnrow"><button id="scan-paste">Paste instead</button><button id="scan-cancel">Cancel</button></div>
  </div></div>
  <!-- Capacitor runtime (copied in by `npm run copy:core`; absent in the plain web build, which is fine) -->
  <script src="vendor/capacitor.js" onerror="void 0"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
